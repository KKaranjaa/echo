services:
  - type: web
    name: echo-web
    env: docker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: echo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: echo-redis
          property: connectionString
      - key: TRANSCRIPTION_BACKEND
        value: groq
      - key: GROQ_API_KEY
        sync: false   # set in Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false   # set in Render dashboard
      - key: EMAIL_HOST_USER
        sync: false   # set in Render dashboard (e.g. your_email@gmail.com)
      - key: EMAIL_HOST_PASSWORD
        sync: false   # set in Render dashboard (Gmail 16-char App Password)
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
    disk:
      name: media
      mountPath: /var/data/media
      sizeGB: 10

  - type: pserv
    name: echo-db
    env: postgres
    plan: free

  - type: redis
    name: echo-redis
    plan: free
