<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Your Email</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }
        .header {
            background-color: #3b82f6;
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 28px;
            letter-spacing: 1px;
        }
        .content {
            padding: 40px 30px;
            text-align: center;
        }
        .content p {
            font-size: 16px;
            color: #cbd5e1;
            margin-bottom: 25px;
        }
        .btn-container {
            margin: 35px 0;
        }
        .btn {
            display: inline-block;
            background-color: #3b82f6;
            color: #ffffff !important;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #2563eb;
        }
        .manual-code {
            background-color: #0f172a;
            border: 1px dashed #475569;
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
        }
        .manual-code h3 {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 0;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .code {
            font-family: monospace;
            font-size: 16px;
            color: #f8fafc;
            word-break: break-all;
            margin: 0;
        }
        .footer {
            background-color: #0f172a;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
            border-top: 1px solid #334155;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Confirm Your Email</h1>
        </div>
        <div class="content">
            <p>Please confirm your email address to continue using ECHO.</p>
            
            <div class="btn-container">
                <a href="{{ activate_url }}" class="btn">Verify Email Address</a>
            </div>
            
            <div class="manual-code">
                <h3>Or enter this code manually</h3>
                <p class="code">{{ key }}</p>
            </div>
        </div>
        <div class="footer">
            If you didn't request this email, you can safely ignore it.
        </div>
    </div>
</body>
</html>
