{% load static %}
<!DOCTYPE html>
<html lang="en" x-data="{ dark: localStorage.getItem('echo-theme') === 'dark' }" :class="dark ? 'dark' : ''" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processing — Echo</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    body {
      background: var(--echo-bg);
      color: var(--echo-text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes echo-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes echo-pulse-ring {
      0%   { transform: scale(1);   opacity: 0.7; }
      100% { transform: scale(1.5); opacity: 0;   }
    }
    @keyframes echo-line-appear {
      from { opacity: 0; transform: scaleX(0); transform-origin: left; }
      to   { opacity: 1; transform: scaleX(1); }
    }
    @keyframes echo-fade-up {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0);   }
    }
    @keyframes echo-progress-bar {
      from { width: 0%;   }
      to   { width: 100%; }
    }
    @keyframes waveFloat {
      0%, 100% { transform: translateY(0px);   }
      50%       { transform: translateY(-6px);  }
    }

    .echo-node-waiting {
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.12);
      color: var(--echo-subtext);
    }
    .echo-node-active {
      background: linear-gradient(135deg, var(--echo-accent), #a855f7);
      box-shadow: 0 0 0 0 var(--echo-accent);
      animation: echo-pulse-ring 1.4s ease-out infinite;
    }
    .echo-node-done {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 2px 12px rgba(16,185,129,0.4);
    }

    .pipeline-card {
      background: var(--echo-surface, rgba(255,255,255,0.04));
      border: 1px solid var(--echo-border, rgba(255,255,255,0.08));
      border-radius: 28px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 24px 64px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.06);
      padding: clamp(2rem, 5vw, 3.5rem);
      width: 100%;
      max-width: 380px;
      position: relative;
      overflow: hidden;
    }

    .pipeline-card::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 30px;
      background: linear-gradient(135deg, var(--echo-accent), transparent 60%);
      opacity: 0.12;
      pointer-events: none;
    }

    .echo-logo {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--echo-accent);
      text-decoration: none;
    }
  </style>
</head>
<body>

<div x-data="echoProcessingPage()" x-init="init()" style="width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; box-sizing: border-box;">

  <!-- Logo -->
  <a href="/" class="echo-logo" style="margin-bottom: 2rem;">ECHO</a>

  <!-- Pipeline Card -->
  <div class="pipeline-card">

    <!-- Header -->
    <p style="font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--echo-subtext, #a1a1aa); font-weight: 700; margin-bottom: 0.4rem;">Processing your lecture</p>
    <p x-text="filename" style="font-size: 0.82rem; font-weight: 600; color: var(--echo-text, #f4f4f5); margin-bottom: 2.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;" title="{{ session.original_filename }}"></p>

    <!-- 4-step vertical pipeline -->
    <div style="display: flex; flex-direction: column; gap: 0; width: 100%; position: relative;">
      <template x-for="(step, i) in steps" :key="i">
        <div style="display: flex; flex-direction: column; align-items: flex-start;">
          <div style="display: flex; align-items: center; gap: 1rem; width: 100%;">

            <!-- Node -->
            <div :class="{
              'echo-node-active':  step.status === 'active',
              'echo-node-done':    step.status === 'done',
              'echo-node-waiting': step.status === 'waiting'
            }" style="width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.4s ease;">
              <template x-if="step.status === 'done'">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
              </template>
              <template x-if="step.status === 'active'">
                <div style="width: 13px; height: 13px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: echo-spin 0.8s linear infinite;"></div>
              </template>
              <template x-if="step.status === 'waiting'">
                <span x-text="i + 1" style="font-size: 0.7rem; font-weight: 700; font-family: 'JetBrains Mono', monospace;"></span>
              </template>
            </div>

            <!-- Label -->
            <div style="flex: 1; min-width: 0;">
              <p x-text="step.label" :style="step.status === 'waiting' ? 'opacity: 0.35' : 'opacity: 1'" style="font-size: 0.9rem; font-weight: 600; color: var(--echo-text, #f4f4f5); transition: opacity 0.3s; margin: 0;"></p>
              <p x-text="step.sub" style="font-size: 0.72rem; color: var(--echo-subtext, #a1a1aa); margin: 2px 0 0 0;"></p>
            </div>

          </div>

          <!-- Connector line -->
          <template x-if="i < steps.length - 1">
            <div style="margin-left: 15px; width: 2px; height: 28px; background: linear-gradient(to bottom, var(--echo-accent, #a855f7), rgba(192,132,252,0.1)); opacity: 0.4; margin-top: 2px; margin-bottom: 2px;"></div>
          </template>
        </div>
      </template>
    </div>

    <!-- Ready state — redirect bar -->
    <div x-show="isComplete" x-transition style="margin-top: 2rem; text-align: center;">
      <p style="font-size: 0.75rem; color: var(--echo-subtext, #a1a1aa); margin-bottom: 0.5rem;">Results prepared — redirecting…</p>
      <div style="width: 100%; height: 2px; border-radius: 2px; background: rgba(192,132,252,0.14); overflow: hidden;">
        <div style="height: 100%; background: var(--echo-accent, #a855f7); animation: echo-progress-bar 1.8s linear forwards;"></div>
      </div>
    </div>

    <!-- Failed state -->
    <div x-show="isFailed" x-transition style="margin-top: 2rem; text-align: center;">
      <p style="font-size: 0.82rem; color: #ef4444; font-weight: 600; margin-bottom: 1rem;">Processing failed.</p>
      <a href="/" style="font-size: 0.8rem; color: var(--echo-accent, #a855f7); font-weight: 600; text-decoration: none;">← Try again</a>
    </div>

  </div>

  <!-- Subtle back link -->
  <a href="/" style="margin-top: 1.5rem; font-size: 0.72rem; color: var(--echo-subtext, #a1a1aa); text-decoration: none; opacity: 0.6; transition: opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.6'">Cancel and go back</a>

</div>

<script>
function echoProcessingPage() {
  return {
    filename: '{{ session.original_filename|escapejs }}',
    isComplete: false,
    isFailed: false,
    _poller: null,

    // Map backend status → which step index is active (0-based)
    // Steps: 0=Uploading, 1=Transcribing, 2=Summarising, 3=Ready
    statusMap: {
      'initiated':         0,
      'uploading':         0,
      'fetching_metadata': 0,
      'downloading':       0,
      'transcribing':      1,
      'summarising':       2,
      'complete':          3,
    },

    steps: [
      { label: 'Uploading',    sub: 'Securing your file',              status: 'active'  },
      { label: 'Transcribing', sub: 'Converting speech to text',       status: 'waiting' },
      { label: 'Summarising',  sub: 'ECHO is reading your lecture',    status: 'waiting' },
      { label: 'Ready',        sub: 'Results prepared',                status: 'waiting' },
    ],

    setActiveStep(idx) {
      this.steps = this.steps.map((s, i) => ({
        ...s,
        status: i < idx ? 'done' : (i === idx ? 'active' : 'waiting')
      }));
    },

    init() {
      // If already complete or failed on page load, handle immediately
      var initialStatus = '{{ session.status }}';
      if (initialStatus === 'complete') {
        this.setActiveStep(this.steps.length); // all done
        this.isComplete = true;
        setTimeout(() => { window.location.href = '/results/{{ session.id }}/'; }, 600);
        return;
      }
      if (initialStatus === 'failed') {
        this.isFailed = true;
        return;
      }

      // Set initial step from backend status
      var idx = this.statusMap[initialStatus] ?? 0;
      this.setActiveStep(idx);

      // Start polling
      this._poller = setInterval(() => {
        fetch('/sessions/{{ session.id }}/status/')
          .then(r => r.json())
          .then(data => {
            var stepIdx = this.statusMap[data.status] ?? 0;
            this.setActiveStep(stepIdx);

            if (data.status === 'complete' && data.result_url) {
              clearInterval(this._poller);
              this.setActiveStep(this.steps.length); // all done
              this.isComplete = true;
              setTimeout(() => { window.location.href = data.result_url; }, 1800);
            } else if (data.status === 'failed') {
              clearInterval(this._poller);
              this.isFailed = true;
            }
          })
          .catch(() => { /* silently ignore blips */ });
      }, 2500);
    }
  };
}
</script>
</body>
</html>
